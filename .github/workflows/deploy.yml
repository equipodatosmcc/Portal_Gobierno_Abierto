name: Deploy Portal Gobierno Abierto

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Usamos tu servidor de la muni como ejecutor
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Deploy
        run: |
          # 1. Entramos a la carpeta en el home de deployer
          cd /home/deployer/Portal_Gobierno_Abierto

          # 2. Forzamos que el servidor se iguale a GitHub (evita errores de 'unmerged files')
          git fetch origin main
          git reset --hard origin/main

          # 3. Build y deploy con Docker usando el archivo de entorno del server
          sudo docker compose --env-file .env.server build app_gobierno_abierto
          sudo docker compose --env-file .env.server up -d app_gobierno_abierto

          # 4. Migraciones (siempre) y seed (solo si RUN_DB_SEED=true en .env.server)
          sudo docker compose --env-file .env.server exec -T app_gobierno_abierto pnpm prisma migrate deploy
          if grep -qE '^[[:space:]]RUN_DB_SEED[[:space:]]=[[:space:]]true[[:space:]]$' .env.server; then
            echo "RUN_DB_SEED=true → ejecutando seed"
            sudo docker compose --env-file .env.server exec -T app_gobierno_abierto pnpm prisma db seed
          else
            echo "RUN_DB_SEED!=true → seed omitido"
          fi

          # 5. Limpieza de imágenes para no llenar el disco de la VM
          sudo docker image prune -f